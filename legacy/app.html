<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Kunjungan</title>
    <link href="./css/style.css" rel="stylesheet" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Material Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />

    <style>
      body,
      header,
      nav,
      main,
      div,
      p,
      h2 {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col min-h-screen font-primary"
  >
    <!-- Header -->
    <header
      class="bg-primary dark:bg-secondary text-white p-4 flex justify-between items-center"
    >
      <img src="assets/logo-rak.png" alt="Logo" class="h-8" />
      <div class="flex items-center gap-3">
        <p id="userId">Hai, ...</p>
        <button
          id="toggle-theme"
          class="border border-white/40 rounded-full p-1 material-symbols-rounded text-white text-2xl cursor-pointer [font-variation-settings:'FILL'_0,'wght'_400,'GRAD'_0,'opsz'_24']"
        >
          dark_mode
        </button>
      </div>
    </header>

    <!-- Konten -->
    <main id="content" class="flex-1 p-4 space-y-4">
      <!-- Konten akan diganti lewat JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav
      class="bg-primary dark:bg-secondary text-white flex justify-around p-2"
    >
      <button id="nav-home" class="flex flex-col items-center cursor-pointer">
        <span
          class="material-symbols-rounded [font-variation-settings:'FILL'_0,'wght'_400,'GRAD'_0,'opsz'_24']"
          >home</span
        >
        <span class="text-xs">Beranda</span>
      </button>
      <button
        id="nav-kunjungan"
        class="flex flex-col items-center cursor-pointer"
      >
        <span
          class="material-symbols-rounded [font-variation-settings:'FILL'_0,'wght'_400,'GRAD'_0,'opsz'_24']"
          >edit</span
        >
        <span class="text-xs">Kunjungan</span>
      </button>
      <button
        id="nav-takterjadwal"
        class="flex flex-col items-center cursor-pointer"
      >
        <span
          class="material-symbols-rounded [font-variation-settings:'FILL'_0,'wght'_400,'GRAD'_0,'opsz'_24']"
          >add_circle</span
        >
        <span class="text-xs">Tak Terjadwal</span>
      </button>
      <button
        id="nav-lainnya"
        class="flex flex-col items-center cursor-pointer"
      >
        <span
          class="material-symbols-rounded [font-variation-settings:'FILL'_0,'wght'_400,'GRAD'_0,'opsz'_24']"
          >more_horiz</span
        >
        <span class="text-xs">Lainnya</span>
      </button>
    </nav>

    <!-- Script -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
